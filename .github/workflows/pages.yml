name: Deploy demo to GitHub Pages

# 交互式预览已隐藏(在线预览链接已从 README 移除)。
# 保留手动触发:如后续需要恢复预览,在此工作流界面点 Run workflow 即可;
# 要恢复自动部署,把下面注释的 push 触发器取消注释。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
