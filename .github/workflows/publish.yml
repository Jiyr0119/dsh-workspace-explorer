name: Publish package

# 发布流程:在 GitHub 上发布 Release(published)时,先跑单元测试 + 类型检查,
# 校验版本号与 tag 一致后,自动 `npm publish` 到 npmjs。
# 认证方式:OIDC 可信发布(Trusted Publishing),无需 NPM_TOKEN 密钥;
# 前置条件:在 npmjs.org 把本仓库配置为 Trusted Publisher
# (https://docs.npmjs.com/generating-provenance-statements),包为 public access。
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: $PACKAGE_VERSION"
          echo "release version: $RELEASE_VERSION"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch between package.json and release tag"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Publish
        run: npm publish --access public
